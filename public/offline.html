<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline — KasKeluarga</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #faf7f0; color: #3f3a32; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
  .card { max-width: 320px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.6; margin: 0 0 16px; }
  button { min-height: 44px; padding: 0 24px; border: 0; border-radius: 12px;
    background: #166534; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <h1>Anda sedang offline</h1>
    <p>KasKeluarga butuh koneksi internet untuk memuat data keuangan terbaru.
       Periksa koneksi Anda lalu coba lagi.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
